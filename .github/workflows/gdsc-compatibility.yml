name: GDSC compatibility tests

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main

jobs:
  python-compatibility:
    name: Python compatibility (${{ matrix.ide }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ide: OpenGDS-IDE
            python_path: .
            compile_command: python -m compileall -q .
          - ide: OpenGDS-IDE-Android
            python_path: app/src/main/python
            compile_command: python -m py_compile app/src/main/python/gdsc_compat.py app/src/main/python/opengds_bridge.py tests/test_gdsc_compat.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check zstandard
      - name: Compile Python sources
        working-directory: ${{ matrix.ide }}
        env:
          PYTHONPATH: ${{ matrix.python_path }}
        run: ${{ matrix.compile_command }}
      - name: Run compatibility regression tests
        working-directory: ${{ matrix.ide }}
        env:
          PYTHONPATH: ${{ matrix.python_path }}
        run: python -m unittest discover -s tests -p "test_gdsc_compat.py" -v
      - name: Run desktop backend and workspace regression tests
        if: matrix.ide == 'OpenGDS-IDE'
        working-directory: OpenGDS-IDE
        run: |
          python -m unittest discover -s tests -p "test_backend.py" -v
          python -m unittest discover -s tests -p "test_project_ops.py" -v
          python -m unittest discover -s tests -p "test_project_manager.py" -v
          python -m unittest discover -s tests -p "test_zstd_support.py" -v
      - name: Run Android core static-debugger regression tests
        if: matrix.ide == 'OpenGDS-IDE-Android'
        working-directory: OpenGDS-IDE-Android
        run: python -m unittest discover -s tests -p "test_native_debugger.py" -v
      - name: Verify real Godot bytecode with GDRE Tools
        if: matrix.ide == 'OpenGDS-IDE'
        working-directory: OpenGDS-IDE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gdre" "$RUNNER_TEMP/real-v100/out" "$RUNNER_TEMP/real-v13/out"
          curl --retry 3 --retry-delay 2 -L --fail \
            "https://github.com/GDRETools/gdsdecomp/releases/download/v2.7.4/GDRE_tools-v2.7.4-linux.zip" \
            -o "$RUNNER_TEMP/gdre/gdre.zip"
          unzip -q "$RUNNER_TEMP/gdre/gdre.zip" -d "$RUNNER_TEMP/gdre"
          GDRE_BIN=""
          while IFS= read -r candidate; do
            if file "$candidate" | grep -q "ELF .*executable"; then
              GDRE_BIN="$candidate"
              break
            fi
          done < <(find "$RUNNER_TEMP/gdre" -type f)
          test -n "$GDRE_BIN"
          chmod +x "$GDRE_BIN"
          file "$GDRE_BIN"
          cat > "$RUNNER_TEMP/real-v100/main.gd" <<'GDSCRIPT'
          extends RefCounted
          const LIMIT := 42
          var total: int = 0
          func add(value: int) -> int:
              total += value
              return total
          GDSCRIPT
          "$GDRE_BIN" --headless \
            --compile="$RUNNER_TEMP/real-v100/main.gd" \
            --bytecode=4.3.0 \
            --output="$RUNNER_TEMP/real-v100/out"
          REAL_V100="$(find "$RUNNER_TEMP/real-v100/out" -type f -name '*.gdc' | head -n 1)"
          test -n "$REAL_V100"
          python tests/verify_real_gdsc.py "$REAL_V100" "$GDRE_BIN" "$RUNNER_TEMP/real-v100/main.gd"

          "$GDRE_BIN" --headless \
            --compile="$RUNNER_TEMP/real-v100/main.gd" \
            --bytecode=3.5.0 \
            --output="$RUNNER_TEMP/real-v13/out"
          REAL_V13="$(find "$RUNNER_TEMP/real-v13/out" -type f -name '*.gdc' | head -n 1)"
          test -n "$REAL_V13"
          python tests/verify_real_legacy_gdsc.py "$REAL_V13" "$GDRE_BIN"

  android-kotlin:
    name: Android Kotlin/Gradle compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          set -o pipefail
      - name: Compile Android debug Kotlin
        working-directory: OpenGDS-IDE-Android
        run: gradle --no-daemon :app:compileDebugKotlin
