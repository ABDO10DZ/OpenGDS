name: OpenGDS-IDE desktop tests

on:
  pull_request:
    paths:
      - "OpenGDS-IDE/**"
      - ".github/workflows/opengds-ide-tests.yml"
  push:
    branches:
      - main
    paths:
      - "OpenGDS-IDE/**"
      - ".github/workflows/opengds-ide-tests.yml"

concurrency:
  group: opengds-ide-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: OpenGDS-IDE
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: OpenGDS-IDE/requirements.txt
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Smoke-test desktop GUI imports
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import main; from PySide6.QtWidgets import QApplication; app = QApplication([]); print('OpenGDS-IDE GUI import and Qt initialization OK')"
      - name: Install optional MCP SDK and packaging tools
        run: python -m pip install -r requirements-mcp.txt "PyInstaller>=6.10,<7"
      - name: Isolate live IDE control bridge tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: python -m unittest discover -s tests -p "test_ide_control.py" -v
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify MCP server imports
        run: python -c "from mcp.server.fastmcp import FastMCP; from mcp_server import OpenGDSMCPService, build_server; print('MCP SDK integration import OK')"
      - name: Build and smoke-test Windows installer script
        if: runner.os == 'Windows'
        shell: cmd
        run: call build_gui.bat
      - name: Validate Unix packaging script syntax
        if: runner.os != 'Windows'
        run: bash -n build_gui.sh
      - name: Build and smoke-test Linux/macOS installer script
        if: runner.os != 'Windows'
        env:
          PYTHON: python
          OPENGDS_BUILD_USE_CURRENT_PYTHON: "1"
          OPENGDS_BUILD_SKIP_INSTALL: "1"
          OPENGDS_BUILD_SKIP_TESTS: "1"
        run: bash build_gui.sh
      - name: Upload verified platform package
        uses: actions/upload-artifact@v7
        with:
          name: OpenGDS-IDE-${{ runner.os }}-Python-${{ matrix.python }}
          path: dist/OpenGDS-IDE*
          if-no-files-found: error
          retention-days: 7
