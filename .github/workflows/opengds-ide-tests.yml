name: OpenGDS-IDE desktop tests

on:
  pull_request:
    paths:
      - "OpenGDS-IDE/**"
      - ".github/workflows/opengds-ide-tests.yml"
  push:
    branches:
      - main
    paths:
      - "OpenGDS-IDE/**"
      - ".github/workflows/opengds-ide-tests.yml"

concurrency:
  group: opengds-ide-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: OpenGDS-IDE
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: OpenGDS-IDE/requirements.txt
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Smoke-test desktop GUI imports
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import main; from PySide6.QtWidgets import QApplication; app = QApplication([]); print('OpenGDS-IDE GUI import and Qt initialization OK')"
      - name: Install optional MCP SDK and packaging tools
        run: python -m pip install -r requirements-mcp.txt "PyInstaller>=6.10,<7"
      - name: Isolate live IDE control bridge tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: python -m unittest discover -s tests -p "test_ide_control.py" -v
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify MCP server imports
        run: python -c "from mcp.server.fastmcp import FastMCP; from mcp_server import OpenGDSMCPService, build_server; print('MCP SDK integration import OK')"
      - name: Create macOS application icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/opengds-ide.iconset
          SOURCE_ICON="assets/opengds-ide.png"
          ICONSET="build/opengds-ide.iconset"
          sips -z 16 16 "$SOURCE_ICON" --out "$ICONSET/icon_16x16.png" >/dev/null
          sips -z 32 32 "$SOURCE_ICON" --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "$SOURCE_ICON" --out "$ICONSET/icon_32x32.png" >/dev/null
          sips -z 64 64 "$SOURCE_ICON" --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$SOURCE_ICON" --out "$ICONSET/icon_128x128.png" >/dev/null
          sips -z 256 256 "$SOURCE_ICON" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "$SOURCE_ICON" --out "$ICONSET/icon_256x256.png" >/dev/null
          sips -z 512 512 "$SOURCE_ICON" --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "$SOURCE_ICON" --out "$ICONSET/icon_512x512.png" >/dev/null
          sips -z 1024 1024 "$SOURCE_ICON" --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o build/opengds-ide.icns
      - name: Build platform-native frozen application
        run: python -m PyInstaller --clean --noconfirm OpenGDS-IDE.spec
      - name: Smoke-test frozen application and embedded core
        run: python tests/smoke_frozen_bundle.py
